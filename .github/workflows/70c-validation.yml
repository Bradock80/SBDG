name: 70C validation

on:
  push:
    branches:
      - work/70c-inventory-intelligence-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SGDB.sln

      - name: Build Release
        run: dotnet build SGDB.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test tests/SGDB.Tests/SGDB.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
